name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  knowledge-image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e . pytest

      # The corpus must be embedded with the same model the watcher uses at query time.
      - name: Start ollama with the embedding model
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          (ollama serve > ollama.log 2>&1 &)
          for _ in $(seq 30); do curl -sf localhost:11434/api/version && break; sleep 2; done
          ollama pull nomic-embed-text

      - name: Rebuild Chroma from the committed entries
        env:
          PW_GITLAB_TOKEN: unused  # required by Settings, never used by load
        run: pipelines-knowledge load

      - name: Check retrieval quality
        env:
          PW_REQUIRE_EMBEDDINGS: "1"  # fail instead of skipping if ollama is unreachable
        run: pytest -v

      - name: Build
        run: |
          podman build -f Containerfile \
            --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }} \
            -t "$IMAGE:${{ github.sha }}" .
      - name: Push
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | podman login "$REGISTRY" -u "${{ github.actor }}" --password-stdin
          podman tag "$IMAGE:${{ github.sha }}" "$IMAGE:latest"
          podman push "$IMAGE:${{ github.sha }}"
          podman push "$IMAGE:latest"
